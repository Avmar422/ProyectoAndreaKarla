<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookFlow</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <nav class="nav">
      <div class="logo">
        <img src="./assets/logo.png" alt="Logo" />
      </div>
      <ul class="menu">
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Catálogo</a></li>
        <li><a href="#">Cuenta</a></li>
        <li><a href="#">Configuración</a></li>
      </ul>
    </nav>

    <main class="main-content">
      <header class="header-main">
        <h1>Book Catalog</h1>

        <div class="filters">
          <select name="availability" id="availability-filter">
            <option>Todos</option>
            <option>Disponible</option>
            <option>Prestado</option>
            <option>Reservado</option>
          </select>
          
          <select name="genre" id="genre-filter">
            <option>Todos</option>
            <option>Ficción</option>
            <option>No Ficción</option>
            <option>Misterio</option>
            <option>Ciencia Ficción</option>
            <option>Biografía</option>
          </select>

          <input
          type="search"
          placeholder="Search by title, author, or ISBN..."
          id="search-box"/>

        </div>
      </header>

      <section>
        <div class="add-book">
          <h2>Add New Book</h2>
          <form id="add-book-form">
            <input type="text" id="title" placeholder="Title" required />
            <input type="text" id="author" placeholder="Author" required />
            <input type="text" id="genre" placeholder="Genre" required />
            <input type="text" id="synopsis" placeholder="Synopsis" required />
            <input type="text" id="status" placeholder="Status" required />
            <input type="text" id="availability" placeholder="Availability" required />
            <button type="submit">Add Book</button>
          </form>
      </section>

      <section class="book-list" id="book-list">
      </section>
    </main>
  </body>
